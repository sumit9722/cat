name: Parallel Python Runner

on: 
  workflow_dispatch: 

jobs:
  run-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        machine: [1, 2, 3, 4, 5] 

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Run the script securely
      - name: Run script
        run: python vote_cat_resilient.py --hearts 200000 --workers 4