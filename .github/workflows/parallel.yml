name: Parallel Python Runner

# This allows you to click a button to run the script manually
on: 
  workflow_dispatch: 

jobs:
  run-python:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel other runs if one fails
      fail-fast: false 
      matrix:
        # This creates 5 parallel machines. Add more numbers to scale up!
        machine: [1, 2, 3, 4, 5] 

    steps:
      # 1. Grab your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Run the script securely
      - name: Run script
        run: python vote_cat_resilient.py --hearts 200000 --workers 4